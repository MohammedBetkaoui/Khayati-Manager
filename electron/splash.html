<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khayati Manager</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Segoe UI, Arial, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(18, 60, 74, 0.1), transparent 55%), #f5f4f0;
        color: #123c4a;
      }
      .card {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        border: 1px solid rgba(18, 60, 74, 0.08);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 60px rgba(18, 60, 74, 0.12);
        backdrop-filter: blur(12px);
      }
      .logo {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(18, 60, 74, 0.16), rgba(195, 154, 91, 0.16));
        overflow: hidden;
      }
      .logo img { width: 72px; height: 72px; object-fit: contain; }
      h1 { margin: 0; font-size: 24px; letter-spacing: 0.2px; }
      p { margin: 0; font-size: 13px; color: rgba(43, 43, 43, 0.75); text-align: center; line-height: 1.5; max-width: 280px; }
      .spinner {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 3px solid rgba(18, 60, 74, 0.12);
        border-top-color: #123c4a;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img src="./assets/icon.ico" alt="Khayati Manager" />
      </div>
      <div>
        <h1>Khayati Manager</h1>
        <p>Gestion intelligente des ateliers de couture</p>
      </div>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </body>
</html>
